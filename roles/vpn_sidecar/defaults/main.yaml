---
vpn_sidecar_backend: l2tp-ipsec
vpn_sidecar_install_kernel_modules: true
vpn_sidecar_kernel_blocklist: []
vpn_sidecar_kernel_allowlist: []
vpn_sidecar_kernel_warning_releases: ['6.8.0-146-generic']
vpn_sidecar_watchdog_cooldown: 300
vpn_sidecar_watchdog_interval: 30
vpn_sidecar_watchdog_registry_image: ""
vpn_sidecar_watchdog_pull_image: true
vpn_sidecar_wait_timeout: 120
vpn_sidecar_install_docker: true
vpn_sidecar_verify_connection: false
vpn_sidecar_retired_timer: ""
vpn_sidecar_dns: ""
vpn_sidecar_force_encaps: "yes"
vpn_sidecar_ike_proposals: >-
  {{ 'aes128-sha1-modp1536,aes256-sha256-modp1536' if vpn_sidecar_backend == 'ipsec-xauth'
     else 'aes256-sha256-modp2048,aes256-sha1-modp2048,aes256-sha1-modp1024,aes128-sha1-modp1024,3des-sha1-modp1024' }}
vpn_sidecar_esp_proposals: >-
  {{ 'aes128-sha1-modp1536,aes256-sha1-modp1536' if vpn_sidecar_backend == 'ipsec-xauth'
     else 'aes256-sha256,aes256-sha1,aes128-sha1,3des-sha1' }}
# Empty builds the pinned source locally; set a tag/digest to pull from a registry.
vpn_sidecar_registry_image: ""
# Disable when testing an image already built or loaded on the VPN host.
vpn_sidecar_pull_image: true
