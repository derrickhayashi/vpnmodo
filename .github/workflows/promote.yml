name: Promote release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to promote (leave blank for newest published prerelease)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: stable-release-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.repository == 'derrickhayashi/vpnmodo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the candidate and promote its existing artifacts
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-pipeline.py promote --version "$RELEASE_VERSION"
      - name: Release link
        env:
          RELEASE_VERSION: ${{ steps.promote.outputs.version }}
        run: printf 'Stable release [%s](https://github.com/derrickhayashi/vpnmodo/releases/tag/%s)\n' "$RELEASE_VERSION" "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
