name: ${COMPOSE_PROJECT_NAME:?Set a unique COMPOSE_PROJECT_NAME in .env}

services:
  vpn:
    image: ${VPN_IMAGE:-tailscale/tailscale:stable}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${TS_HOSTNAME:-vpn-sidecar}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "false"
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9002/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  application:
    image: alpine:3.22
    command: ["sleep", "infinity"]
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
    volumes:
      # Compose cannot set dns on a service sharing another service's network.
      - ./resolv.conf:/etc/resolv.conf:ro
    restart: unless-stopped

volumes:
  tailscale-state:
