charon {
    load_modular = yes
    port = 500
    port_nat_t = 4500
    retransmit_timeout = 2
    retransmit_tries = 3
    plugins {
        include /etc/strongswan.d/charon/*.conf
        # The profile's explicit DNS list is the only workload resolver policy.
        resolve { load = no }
        # IKE and outer ESP use the main route, never the virtual-IP route.
        socket-default { fwmark = 0x76706e6d }
        kernel-netlink { fwmark = !0x76706e6d }
    }
    syslog { daemon { default = -1 } auth { default = -1 } }
    filelog {
        stdout {
            path = /dev/stdout
            default = 1
            flush_line = yes
        }
    }
}
