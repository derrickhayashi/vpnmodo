name: ${COMPOSE_PROJECT_NAME:?Set a unique project name}
services:
  vpn:
    image: ${VPN_IMAGE:?Set VPN_IMAGE}
    cap_add:
      - NET_ADMIN
    environment:
      STRONGSWAN_CONF: /test/strongswan.conf
      VPN_SERVER: ${VPN_SERVER:?Set VPN_SERVER}
      VPN_IKE_PROPOSALS: ${VPN_IKE_PROPOSALS:?Set VPN_IKE_PROPOSALS}
      VPN_ESP_PROPOSALS: ${VPN_ESP_PROPOSALS:?Set VPN_ESP_PROPOSALS}
    entrypoint: ["sh", "-c"]
    command: ["umask 077; exec expect /test/connect.exp > /run/control/test.log 2>&1"]
    logging:
      driver: none
    volumes:
      - ${VPN_CREDENTIALS_DIR:?Set VPN_CREDENTIALS_DIR}/vpn.credentials:/run/secrets/vpn.credentials:ro
      - ${VPN_PROJECT_DIR:?Set VPN_PROJECT_DIR}/run:/run/control
      - ${VPN_BACKEND_DIR}/connect.exp:/test/connect.exp:ro
      - ${VPN_BACKEND_DIR}/strongswan.conf:/test/strongswan.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "ip xfrm policy list | grep -q 'proto esp'"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 300s
  application:
    image: alpine:3.22
    command: ["sleep", "infinity"]
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
