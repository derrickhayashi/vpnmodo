name: vpnmodo-controller
services:
  controller:
    image: ${VPNMODO_CONTROLLER_IMAGE:?Set a controller image}
    container_name: vpnmodo-controller
    user: ${VPNMODO_UID:?Set the VM user UID}:${VPNMODO_GID:?Set the VM user GID}
    group_add:
      - ${VPNMODO_DOCKER_GID:?Set the Docker socket group GID}
    labels:
      io.vpnmodo.managed-by: vpnmodo
      io.vpnmodo.component: controller
    environment:
      VPNMODO_STATE_DIR: ${VPNMODO_DATA_ROOT:?Set the private host data root}/controller-state
      VPNMODO_IKEV2_IMAGE: ${VPNMODO_IKEV2_IMAGE:-vpnmodo-ikev2:dev}
      VPNMODO_L2TP_IMAGE: ${VPNMODO_L2TP_IMAGE:-vpnmodo-l2tp:dev}
      VPNMODO_APPLICATION_IMAGE: ${VPNMODO_APPLICATION_IMAGE:-alpine:3.22}
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - type: bind
        source: ${VPNMODO_DATA_ROOT}
        target: ${VPNMODO_DATA_ROOT}
        bind:
          create_host_path: false
    tmpfs:
      - /run/vpnmodo:rw,noexec,nosuid,nodev,mode=0700,uid=${VPNMODO_UID},gid=${VPNMODO_GID}
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
