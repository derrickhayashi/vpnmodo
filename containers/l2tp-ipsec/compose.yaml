name: ${COMPOSE_PROJECT_NAME:?Set a unique COMPOSE_PROJECT_NAME in .env}

services:
  vpn:
    image: ${VPN_IMAGE:?Set VPN_IMAGE to a tagged image or digest in .env}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/ppp:/dev/ppp
    sysctls:
      # This sample builds an IPv4-only tunnel. Disable IPv6 in the shared
      # namespace so it cannot become a path around the IPv4 kill switch.
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    environment:
      VPN_SERVER: ${VPN_SERVER:?Set VPN_SERVER in .env}
      VPN_HEALTH_HOST: ${VPN_HEALTH_HOST:?Set a tunnel-reachable VPN_HEALTH_HOST in .env}
      VPN_HEALTH_PORT: ${VPN_HEALTH_PORT:-22}
      VPN_DNS: ${VPN_DNS:-}
      VPN_FORCE_ENCAPS: ${VPN_FORCE_ENCAPS:-yes}
      VPN_IKE_PROPOSALS: ${VPN_IKE_PROPOSALS:-aes256-sha256-modp2048,aes256-sha1-modp2048,aes256-sha1-modp1024,aes128-sha1-modp1024,3des-sha1-modp1024}
      VPN_ESP_PROPOSALS: ${VPN_ESP_PROPOSALS:-aes256-sha256,aes256-sha1,aes128-sha1,3des-sha1}
      VPN_USERNAME_FILE: /run/secrets/vpn_username
      VPN_PASSWORD_FILE: /run/secrets/vpn_password
      VPN_PSK_FILE: /run/secrets/vpn_psk
    secrets:
      - vpn_username
      - vpn_password
      - vpn_psk
    healthcheck:
      test: ["CMD", "/usr/local/bin/vpn-healthcheck"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 45s
    restart: unless-stopped

    # Publish application ports here because application shares this network
    # namespace. Example:
    # ports:
    #   - "127.0.0.1:8080:8080"

  application:
    image: alpine:3.20
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
    # Docker forbids the Compose `dns` option with `network_mode: service:*`.
    # Point this container at dnsmasq in the shared namespace from inside the
    # container instead.
    command:
      - sh
      - -c
      - |
        printf 'nameserver 127.0.0.1\noptions ndots:0\n' > /etc/resolv.conf
        exec sleep infinity
    restart: unless-stopped

secrets:
  vpn_username:
    file: ${VPN_CREDENTIALS_DIR:-./secrets}/username
  vpn_password:
    file: ${VPN_CREDENTIALS_DIR:-./secrets}/password
  vpn_psk:
    file: ${VPN_CREDENTIALS_DIR:-./secrets}/psk
